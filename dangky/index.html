    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Y hệt index.html gốc: tắt hover: giả trên thiết bị chạm, chỉ giữ hover thật (chuột).
      tailwind.config = {
        // QUY TẮC TRANG /butchimau/: iPad/máy tính bảng hiển thị Y HỆT điện thoại. Các mốc sm/md/lg/xl/2xl chỉ bật khi màn hình đủ rộng
        // VÀ thiết bị dùng CHUỘT (hover: hover + pointer: fine) -> thiết bị cảm ứng (iPad dọc/ngang, iPad Pro...) không bao giờ chạm mốc
        // "máy tính", luôn dùng bố cục điện thoại. sm/md/lg đều cùng mốc 1024px: cửa sổ trình duyệt máy tính hẹp hơn 1024px cũng ra bố cục
        // điện thoại (không còn bố cục "tablet" ở giữa), từ 1024px trở lên (có chuột) giữ y hệt bản máy tính cũ.
        // (JS tương ứng: DESKTOP_MQ trong KhoaHocPage.jsx - 2 nơi phải đi cùng nhau.)
        theme: {
          screens: {
            sm: { raw: '(min-width: 1024px) and (hover: hover) and (pointer: fine)' },
            md: { raw: '(min-width: 1024px) and (hover: hover) and (pointer: fine)' },
            lg: { raw: '(min-width: 1024px) and (hover: hover) and (pointer: fine)' },
            xl: { raw: '(min-width: 1280px) and (hover: hover) and (pointer: fine)' },
            '2xl': { raw: '(min-width: 1536px) and (hover: hover) and (pointer: fine)' },
          },
        },
        plugins: [
          function ({ addVariant }) {
            addVariant('hover', '@media (hover: hover) { &:hover }');
            addVariant('group-hover', '@media (hover: hover) { :merge(.group):hover & }');
            addVariant('peer-hover', '@media (hover: hover) { :merge(.peer):hover ~ & }');
          },
        ],
      };
    </script>

    <script>
      // Y hệt index.html gốc: bỏ focus dính lại sau khi chạm trên thiết bị cảm ứng.
      if (window.matchMedia('(hover: none)').matches) {
        document.addEventListener('touchend', () => {
          const el = document.activeElement;
          if (!el || el === document.body || typeof el.blur !== 'function') return;
          const tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          el.blur();
        }, { passive: true });
      }
    </script>
