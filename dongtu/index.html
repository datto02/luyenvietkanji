    <script>
      // Y hệt index.html gốc: tắt hover: giả trên thiết bị chạm, chỉ giữ hover thật (chuột).
      tailwind.config = {
        plugins: [
          function ({ addVariant }) {
            addVariant('hover', '@media (hover: hover) { &:hover }');
            addVariant('group-hover', '@media (hover: hover) { :merge(.group):hover & }');
            addVariant('peer-hover', '@media (hover: hover) { :merge(.peer):hover ~ & }');
            addVariant('desktop', '@media (min-width: 1024px) and (hover: hover) and (pointer: fine)');
          },
        ],
      };
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; }

      /* Dải CHẾ ĐỘ của Từ vựng trên điện thoại (KanjiNav) cuộn ngang được nhưng KHÔNG hiện
         thanh cuộn - thanh cuộn ngang lộ ra giữa thanh công cụ trông rất lệch. */
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* GIẤU THANH TRƯỢT CỦA CẢ TRANG - y hệt kanji/index.html (xem giải thích đầy đủ ở đó).
         CHỈ ẩn thanh trượt, KHÔNG khoá cuộn. */
      html, body { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

      /* Nền cả trang cùng màu xanh nhạt (user 28/11): đóng bàn phím mà trang kịp hở ra thì cũng không thấy mảng trắng.
         "html body" để thắng màu nền body trong index.css nạp sau. */
      html, html body { background-color: #F0F6FF; }

      /* Tiêu đề "TỰ ĐỘNG TỪ - THA ĐỘNG TỪ" LUÔN NẰM 1 DÒNG trên điện thoại (user 28/11): chữ co theo bề ngang màn hình.
         Cả câu rộng tối đa ~15,4 lần cỡ chữ, chia 16.2 để còn dư lề; 32px = đệm 2 bên của trang. */
      h1.dt-tieude { font-size: min(24px, calc((100vw - 32px) / 16.2)); }
      @media (min-width: 640px) { h1.dt-tieude { font-size: 32px; } }

      /* Chữ động từ + cách đọc trong 2 ô tự | tha ở trang chi tiết: điện thoại LUÔN 1 dòng, không chạm mép (user 28/11).
         Mỗi ô rộng nửa màn hình; chữ Nhật mỗi chữ rộng 1 lần cỡ chữ nên cỡ chữ = bề ngang còn lại / số chữ (--n). */
      .dt-tu { font-size: min(28px, calc((50vw - 48px) / var(--n, 1))); }
      .dt-doc { font-size: min(17px, calc((50vw - 48px) / var(--n, 1))); }
      @media (min-width: 640px) { .dt-tu { font-size: 34px; } .dt-doc { font-size: 18px; } }
    </style>
    <script>
      // Y hệt index.html gốc: bỏ focus dính lại sau khi chạm trên thiết bị cảm ứng.
      if (window.matchMedia('(hover: none)').matches) {
        document.addEventListener('touchend', () => {
          const el = document.activeElement;
          if (!el || el === document.body || typeof el.blur !== 'function') return;
          const tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          el.blur();
        }, { passive: true });
      }
    </script>
