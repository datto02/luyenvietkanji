    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Y hệt index.html gốc: tắt hover: giả trên thiết bị chạm, chỉ giữ hover thật (chuột).
      tailwind.config = {
        plugins: [
          function ({ addVariant }) {
            addVariant('hover', '@media (hover: hover) { &:hover }');
            addVariant('group-hover', '@media (hover: hover) { :merge(.group):hover & }');
            addVariant('peer-hover', '@media (hover: hover) { :merge(.peer):hover ~ & }');
            addVariant('desktop', '@media (min-width: 1024px) and (hover: hover) and (pointer: fine)');
          },
        ],
      };
    </script>
    <style>
      * { -webkit-tap-highlight-color: transparent; }

      /* Dải CHẾ ĐỘ của Từ vựng trên điện thoại (KanjiNav) cuộn ngang được nhưng KHÔNG hiện
         thanh cuộn - thanh cuộn ngang lộ ra giữa thanh công cụ trông rất lệch. */
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* GIẤU THANH TRƯỢT CỦA CẢ TRANG - y hệt kanji/index.html (xem giải thích đầy đủ ở đó).
         CHỈ ẩn thanh trượt, KHÔNG khoá cuộn. */
      html, body { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    </style>
    <script>
      // Y hệt index.html gốc: bỏ focus dính lại sau khi chạm trên thiết bị cảm ứng.
      if (window.matchMedia('(hover: none)').matches) {
        document.addEventListener('touchend', () => {
          const el = document.activeElement;
          if (!el || el === document.body || typeof el.blur !== 'function') return;
          const tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          el.blur();
        }, { passive: true });
      }
    </script>
