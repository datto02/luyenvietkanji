    <script>

    <style>
      * { -webkit-tap-highlight-color: transparent; }

      /* TRANG SHADOWING (src/podcast/PodcastPage.tsx). Class TỰ VIẾT (Tailwind CDN không có sẵn): giấu thanh cuộn của khung ngoài. */
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* Chỉ ẩn thanh trượt của cả trang (không khoá cuộn) - y hệt các trang /kanji/, /kaiwa/. */
      html, body { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
      /* Thanh tua / âm lượng của trình phát (chép từ Dora Kaiwa, đổi sang xanh Phá Đảo) - --fill = phần đã chạy. */
      .player-range { --fill: 0%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; outline: none; cursor: pointer;
        background: linear-gradient(to right, #5B9BFF var(--fill), rgba(255,255,255,.35) var(--fill)); }
      .player-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #fff;
        box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: pointer; transition: transform .15s ease; }
      .player-range::-webkit-slider-thumb:hover, .player-range:active::-webkit-slider-thumb { transform: scale(1.2); }
      .player-range::-moz-range-track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.35); }
      .player-range::-moz-range-progress { height: 4px; border-radius: 999px; background: #5B9BFF; }
      .player-range::-moz-range-thumb { width: 13px; height: 13px; border: none; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); cursor: pointer; }
      /* Thẻ "câu đang phát" dưới video: chỉ máy tính - ẩn trên thiết bị cảm ứng thật (không theo độ rộng cửa sổ). */
      /* furigana: chữ nhỏ phía trên chữ Hán; inline style của khung giữ line-height (tránh Tailwind CDN sm:text-* đè leading) */
      /* Furigana tự vẽ (xem FuriText trong PodcastPage.tsx): KHÔNG position/transform (nhẹ khi cuộn trên điện thoại); cỡ chữ + lề do style inline. */
      .pod-furi { display: inline-block; line-height: 1; white-space: nowrap; vertical-align: baseline; }
      .pod-furi-rt { display: block; text-align: center; font-size: 0.62em; font-weight: 500; line-height: 1; white-space: nowrap; color: #5B6B85; letter-spacing: 0;
        user-select: none; -webkit-user-select: none; pointer-events: none; }
      /* KHUNG VIDEO: luôn 16:9. Điện thoại/iPad = rộng hết cột; máy tính: PodcastPage.tsx đặt bề rộng (thu nhỏ khi thẻ câu đang phát dài) */
      .pod-vid-box { width: 100%; aspect-ratio: 16 / 9; }
      /* Điện thoại / iPad dọc (<1024px): video nhỏ hơn một chút, căn giữa (user 24/11) */
      @media (max-width: 1023.98px) { .pod-vid-box { width: 92% !important; } }
      @media (hover: none) and (pointer: coarse) { .current-sentence-card { display: none !important; } }
    </style>
    <script>
      // Y hệt index.html gốc: bỏ focus dính lại sau khi chạm trên thiết bị cảm ứng.
      if (window.matchMedia('(hover: none)').matches) {
        document.addEventListener('touchend', () => {
          const el = document.activeElement;
          if (!el || el === document.body || typeof el.blur !== 'function') return;
          const tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          el.blur();
        }, { passive: true });
      }
    </script>
