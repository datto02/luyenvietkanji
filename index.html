    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Trên máy tính: giữ nguyên 100% hiệu ứng hover:... như cũ.
      // Trên điện thoại/tablet: TẮT hẳn hiệu ứng hover:... (đổi màu khi "di chuột vào") - vì
      // thiết bị chạm không có chuột thật, trình duyệt giả lập :hover khi chạm tay rồi không
      // có gì trigger mouseleave để gỡ nó ra, khiến nút bị dính sáng sau khi thả tay. Định
      // nghĩa lại variant "hover" của Tailwind để chỉ áp dụng trong @media (hover: hover) -
      // đúng nghĩa "có con trỏ hover thật" (chuột), không áp dụng trên thiết bị chạm. Bấm 1
      // lần trên điện thoại vẫn hoạt động bình thường (onClick không phụ thuộc hover:...).
      //
      // group-hover:/peer-hover: là 2 variant RIÊNG của Tailwind (không tự kế thừa từ addVariant
      // 'hover' ở trên) - dùng rất nhiều để đổi màu icon/chữ con khi hover vào thẻ cha (card).
      // Nếu không gate luôn 2 cái này thì icon/chữ bên trong card vẫn bị dính màu trên di động
      // dù nút cha đã hết dính. Selector giữ nguyên định nghĩa gốc của Tailwind, chỉ bọc thêm
      // @media (hover: hover).
      tailwind.config = {
        plugins: [
          function ({ addVariant }) {
            addVariant('hover', '@media (hover: hover) { &:hover }');
            addVariant('group-hover', '@media (hover: hover) { :merge(.group):hover & }');
            addVariant('peer-hover', '@media (hover: hover) { :merge(.peer):hover ~ & }');
          },
        ],
      };
    </script>
    <style>
      /* Tắt hẳn ô sáng mặc định (tap highlight) mà trình duyệt di động tự vẽ khi chạm vào bất
         kỳ phần tử nào - đây là phần khiến nút trông như bị "dính màu" dù CSS :hover đã được
         gate ở trên. Áp dụng toàn trang, không cần thêm style riêng cho từng nút. Máy tính
         không bị ảnh hưởng vì thuộc tính này chỉ có tác dụng khi chạm tay. */
      * { -webkit-tap-highlight-color: transparent; }
    </style>
    <script>
      // Lưới an toàn cuối cùng, áp dụng cho TOÀN TRANG (không cần sửa từng component):
      // sau khi ngón tay rời khỏi màn hình, tự động bỏ focus phần tử vừa chạm. Một số trình
      // duyệt di động vẫn giữ :active/:focus (viền, nền tô) trên nút/link sau khi thả tay dù
      // :hover đã được gate ở trên, khiến nút trông như bị "dính màu". Chỉ chạy trên thiết bị
      // chạm thật (matchMedia (hover: none)) nên không đụng gì đến máy tính.
      //
      // Bỏ qua các ô đang NHẬP LIỆU (input/textarea/contenteditable): nếu không loại trừ,
      // mọi touchend trên toàn trang - kể cả một cú vuốt để cuộn xem lại bài đang viết - đều
      // sẽ blur() ô đó và làm bàn phím ảo tự đóng ngay khi thả tay (gặp ở chế độ viết tự luận).
      if (window.matchMedia('(hover: none)').matches) {
        document.addEventListener('touchend', () => {
          const el = document.activeElement;
          if (!el || el === document.body || typeof el.blur !== 'function') return;
          const tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          el.blur();
        }, { passive: true });
      }
    </script>
