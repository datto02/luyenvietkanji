      /* Hiệu ứng "hiện dần" dùng trong các game (animate-in fade-in / zoom-in-95 / slide-in-from-top-2): Tailwind CDN KHÔNG có sẵn plugin tailwindcss-animate nên các class này

      @keyframes gkZoom { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }

      .animate-in.fade-in { animation-name: gkFade; }
      .animate-in.zoom-in-95 { animation-name: gkZoom; }
      .animate-in.slide-in-from-top-2 { animation-name: gkSlide; }

        }, { passive: true });
      }
