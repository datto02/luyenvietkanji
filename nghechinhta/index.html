    <style>
      * { -webkit-tap-highlight-color: transparent; }

      /* Class TỰ VIẾT (không phải utility có sẵn của Tailwind) - Y HỆT kaiwa/index.html/
         kanji/index.html: NgheChinhTaPage.jsx đặt class này lên khung ngoài cùng để giấu thanh
         cuộn riêng của khung đó. Thiếu định nghĩa này thì class "no-scrollbar" trong JSX không
         có tác dụng gì (Tailwind CDN không biết "no-scrollbar" là gì). */
      .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* GIẤU THANH TRƯỢT CỦA CẢ TRANG - Y HỆT kanji/index.html/kaiwa/index.html (style này chỉ
         nằm trong nghechinhta/index.html nên không ảnh hưởng trang chủ hay trang nào khác). */
      html, body { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    </style>
    <script>
      // Y hệt index.html gốc: bỏ focus dính lại sau khi chạm trên thiết bị cảm ứng.
      if (window.matchMedia('(hover: none)').matches) {
        document.addEventListener('touchend', () => {
          const el = document.activeElement;
          if (!el || el === document.body || typeof el.blur !== 'function') return;
          const tag = el.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable) return;
          el.blur();
        }, { passive: true });
      }
    </script>
